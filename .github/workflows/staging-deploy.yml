name: Deploy ERP Software to VPS (Staging)

on:
  push:
    branches: ["develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="/var/www/staging/TPHL-ERP"
            DATABASE_DIR="/var/www/staging/TPHL-ERP/schema/custom-migration"

            echo "Moving to project directory"
            cd $PROJECT_DIR

            echo "Fetch latest code from GitHub"
            git fetch origin develop

            echo "Resetting local repo to match GitHub (force clean deploy)"
            git reset --hard origin/develop
            git clean -fd


            echo "Verifying SQL file integrity..."
            echo "tphl_db.sql lines: $(wc -l < $DATABASE_DIR/tphl_db.sql)"
            echo "drop_table.sql lines: $(wc -l < $DATABASE_DIR/drop_table.sql)"

            # Drop all tables first
            # echo "Dropping all tables..."
            # mysql -u final_erp_user -p${{ secrets.DB_PASS }} final_erp_db < $DATABASE_DIR/drop_table.sql

            # Import fresh database
            # echo "Importing fresh database..."
            # mysql -u final_erp_user -p${{ secrets.DB_PASS }} final_erp_db < $DATABASE_DIR/tphl_db.sql



            # ###### for STAGING  db only - to avoid any accidental data loss in production db during testing
            # Drop all tables first
            # echo "Dropping all tables..."
            # mysql -u erp_staging_user -p${{ secrets.STAGING_DB_PASS }} erp_staging_db < $DATABASE_DIR/drop_table.sql

            # Import fresh database
            # echo "Importing fresh database..."
            # mysql -u erp_staging_user -p${{ secrets.STAGING_DB_PASS }} erp_staging_db < $DATABASE_DIR/tphl_db.sql

            echo "Setting correct permissions"
            sudo chown -R www-data:www-data $PROJECT_DIR
            sudo find $PROJECT_DIR -type d -exec chmod 755 {} \;
            sudo find $PROJECT_DIR -type f -exec chmod 644 {} \;

            # Project upload in Main From Staging (Safeguarding public/uploads)
            echo "Backing up live uploads folder..."
            if [ -d "/var/www/html/TPHL-ERP/public/uploads" ] && [ ! -d "/var/www/html/uploads_backup_temp" ]; then
                mv /var/www/html/TPHL-ERP/public/uploads /var/www/html/uploads_backup_temp
            fi

            echo "Copying files to production..."
            rm -rf /var/www/html/TPHL-ERP/*
            cp -r /var/www/staging/TPHL-ERP/* /var/www/html/TPHL-ERP/
            cp -r /var/www/staging/TPHL-ERP/.htaccess /var/www/html/TPHL-ERP/

            echo "Restoring live uploads folder..."
            if [ -d "/var/www/html/uploads_backup_temp" ]; then
                rm -rf /var/www/html/TPHL-ERP/public/uploads
                mv /var/www/html/uploads_backup_temp /var/www/html/TPHL-ERP/public/uploads
            else
                mkdir -p /var/www/html/TPHL-ERP/public/uploads
            fi

            # Copy any missing uploaded files from Staging without overwriting Live files
            if [ -d "/var/www/staging/TPHL-ERP/public/uploads" ]; then
                cp -rn /var/www/staging/TPHL-ERP/public/uploads/. /var/www/html/TPHL-ERP/public/uploads/ || true
            fi
            mkdir -p /var/www/html/TPHL-ERP/public/uploads/transactions

            echo "Setting correct permissions for production..."
            sudo chown -R www-data:www-data /var/www/html/TPHL-ERP
            sudo find /var/www/html/TPHL-ERP -type d -exec chmod 755 {} \;
            sudo find /var/www/html/TPHL-ERP -type f -exec chmod 644 {} \;

            echo "Deployment completed successfully"

            # echo ">>> Dropping all tables (old common_ecom_db - NOT USED)"
            # mysql -u common_ecom_user -p${{ secrets.DB_PASS }} common_ecom_db -e "SET FOREIGN_KEY_CHECKS=0; \
            # SET @tables = NULL; \
            # SELECT GROUP_CONCAT(CONCAT('\', table_name, '\')) INTO @tables \
            # FROM information_schema.tables \
            # WHERE table_schema = 'common_ecom_db'; \
            # SET @tables = CONCAT('DROP TABLE IF EXISTS ', @tables); \
            # PREPARE stmt FROM @tables; \
            # EXECUTE stmt; \
            # DEALLOCATE PREPARE stmt; \
            # SET FOREIGN_KEY_CHECKS=1;"